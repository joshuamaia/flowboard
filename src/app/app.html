<a class="skip-link" href="#main-content">Pular para o conteúdo</a>

<app-sidebar id="app-sidebar" [open]="sidebarOpen()" (closed)="closeSidebar()" />

@if (sidebarOpen()) {
  <button
    type="button"
    class="backdrop"
    tabindex="-1"
    aria-label="Fechar menu"
    (click)="closeSidebar()"
  ></button>
}

<div class="main-column">
  <app-header (menuToggled)="toggleSidebar()" (createTask)="openTaskDialog()">
    <app-simulation-controls />
  </app-header>

  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>

@defer (on idle) {
  <app-task-create-dialog />
  <app-confirm-dialog />
}

<app-toast-container />
