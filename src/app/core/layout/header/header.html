<button
  type="button"
  class="btn btn-ghost btn-icon menu"
  aria-label="Abrir menu"
  aria-controls="app-sidebar"
  (click)="menuToggled.emit()"
>
  <app-icon name="menu" />
</button>

<div class="heading">
  <h1>{{ page().title }}</h1>
  @if (page().description) {
    <p>{{ page().description }}</p>
  }
</div>

<div class="actions">
  <ng-content />
  <button
    type="button"
    class="btn btn-ghost btn-icon"
    [attr.aria-label]="themeLabel()"
    [title]="themeLabel()"
    (click)="toggleTheme()"
  >
    <app-icon [name]="isDark() ? 'sun' : 'moon'" />
  </button>
  <button type="button" class="btn btn-primary new-task" (click)="createTask.emit()">
    <app-icon name="plus" />
    <span class="new-task-label">Nova tarefa</span>
  </button>
</div>
